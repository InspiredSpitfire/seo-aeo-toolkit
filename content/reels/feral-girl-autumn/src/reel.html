<!doctype html><html><head><meta charset="utf-8">
<script src="fonts.js"></script>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:#0a0a0a;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(130px);will-change:transform}
#b1{width:940px;height:940px;background:#ff2e88;opacity:.60}
#b2{width:860px;height:860px;background:#78e2da;opacity:.42}
#b3{width:760px;height:760px;background:#b0179c;opacity:.55}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 78% 66% at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,.34) 60%,rgba(0,0,0,.86) 100%)}
#grain{position:absolute;inset:-200px;opacity:.14;mix-blend-mode:overlay;background-repeat:repeat}
#scan{position:absolute;inset:0;opacity:.045;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.9) 0 1px,transparent 1px 4px)}
#flash{position:absolute;inset:0;background:#ff2e88;opacity:0;mix-blend-mode:screen}
.card{position:absolute;left:78px;right:78px;top:47%;text-align:center;opacity:0;will-change:transform,opacity}
.ln{font-family:Anton,sans-serif;text-transform:uppercase;color:#fff;line-height:1.0;white-space:nowrap;
  text-shadow:0 8px 44px rgba(0,0,0,.92),0 2px 6px rgba(0,0,0,.85)}
.pink{color:#ff2e88;text-shadow:0 0 38px rgba(255,46,136,.8),0 8px 44px rgba(0,0,0,.85)}
.cy{color:#78e2da;text-shadow:0 0 34px rgba(120,226,218,.65),0 8px 44px rgba(0,0,0,.85)}
.yl{color:#eaff3d;text-shadow:0 0 36px rgba(234,255,61,.7),0 8px 44px rgba(0,0,0,.85)}
.hk{font-family:Inter,sans-serif;font-weight:900;letter-spacing:-.025em;line-height:1.04;white-space:nowrap;
  text-shadow:0 8px 44px rgba(0,0,0,.95)}
#mark{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-family:Inter,sans-serif;
  font-weight:900;font-size:30px;letter-spacing:.30em;color:#78e2da;opacity:0;text-transform:uppercase}
</style></head><body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <div id="scan"></div><div id="vig"></div><div id="grain"></div><div id="flash"></div>
  <div id="cards"></div>
  <div id="mark">She Rebels 🤘</div>
</div>
<script>
for (const [n,b64] of Object.entries(window.FONTS)) {
  const fam = n==='anton'?'Anton':n==='inter'?'Inter':'ArchivoBlack';
  const f = new FontFace(fam, `url(data:font/woff2;base64,${b64}) format('woff2')`,{weight:n==='inter'?'900':'400'});
  document.fonts.add(f); f.load();
}
(function(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d'), d=x.createImageData(256,256);
  let s=7;const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  for(let i=0;i<d.data.length;i+=4){const v=200*rnd()+28;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
  document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`;
})();

const S = [
 {a:0.0 ,b:3.0 ,type:'hook'},
 {a:3.0 ,b:4.8 ,fs:165,L:['<span class="pink">F#ck</span>','hot girl summer.']},
 {a:4.8 ,b:8.0 ,type:'drop'},
 {a:8.0 ,b:10.3,fs:120,L:['I’m over 40','+ ADHD','+ <span class="cy">perimenopause.</span>']},
 {a:10.3,b:13.2,fs:106,L:['Nobody warned us','these two would team up','like a <span class="pink">villain origin story.</span>']},
 {a:13.2,b:15.0,fs:140,L:['One takes','your focus.']},
 {a:15.0,b:17.7,fs:120,L:['The other takes','whatever <span class="yl">f#cks you','had left.</span>']},
 {a:17.7,b:19.9,fs:126,L:['I remember being','a fully functional adult.']},
 {a:19.9,b:22.0,fs:150,L:['Just kidding.','<span class="pink">I don’t remember.</span>']},
 {a:22.0,b:24.4,fs:132,L:['I don’t remember','walking into','this room either.']},
 {a:24.4,b:26.5,fs:180,L:['I cried at','<span class="cy">Costco.</span>']},
 {a:26.5,b:29.4,fs:106,L:['My hormones and dopamine','went on vacation without me.','<span class="pink">Ash-holes.</span>']},
 {a:29.4,b:31.6,fs:132,L:['<span class="cy">Unfiltered</span>','is our new','default mode.']},
 {a:31.6,b:34.3,fs:112,L:['Uniform: sweatpants','and an attitude.','<span class="pink">Any attitude, anytime.</span>']},
 {a:34.3,b:36.3,fs:150,L:['Say no','like it’s <span class="cy">cardio.</span>']},
 {a:36.3,b:39.0,fs:106,L:['Saying the quiet parts','out loud is our','<span class="yl">social currency.</span>']},
 {a:39.0,b:42.3,fs:100,L:['Let AI do the boring crap','so your <span class="yl">3 good brain hours</span>','go to what matters.']},
 {a:42.3,b:44.0,fs:160,L:['You’re not','broken.']},
 {a:44.0,b:48.0,fs:88 ,L:['You’re running an outdated system','never built for neurodivergent,','<span class="pink">perimenopausal goblins</span>','<span class="pink">on wrecking balls.</span>']},
 {a:48.0,b:50.4,fs:112,L:['Drop your','<span class="cy">feral girl autumn rule</span>','below.']},
 {a:50.4,b:53.4,fs:132,L:['Follow me into','<span class="pink">feral girl autumn.</span>','<span style="font-size:1.15em">🤘</span>']},
];
const DUR = 53.4, MAXW = 924, MAXH = 1180;

const wrap=document.getElementById('cards');
const els = S.map(s=>{
  const d=document.createElement('div'); d.className='card';
  if(s.type==='hook'){
    d.innerHTML='<div class="hk" id="hk1" style="font-size:100px;color:#fff">Doctor: it’s perimenopause</div>'+
                '<div class="hk yl" id="hk2" style="font-size:118px;margin-top:44px">ADHD: good luck, b!tch</div>';
  } else if(s.type==='drop'){
    d.innerHTML='<div class="ln cy" style="font-size:80px;letter-spacing:.18em;margin-bottom:30px">It’s</div>'+
                '<div class="ln pink" id="dropTxt" style="font-size:190px;line-height:.92">Feral</div>'+
                '<div class="ln pink dropL" style="font-size:190px;line-height:.92">Girl</div>'+
                '<div class="ln pink dropL" style="font-size:190px;line-height:.92">Autumn</div>';
  } else {
    d.innerHTML = s.L.map(l=>`<div class="ln" style="font-size:${s.fs}px">${l}</div>`).join('');
  }
  wrap.appendChild(d); return d;
});

// ---- autofit: shrink until every line fits the safe width and the block fits the height
function fit(){
  els.forEach(el=>{
    el.style.opacity='1'; el.style.transform='translateY(-50%)';
    const lines=[...el.children];
    for(let pass=0;pass<80;pass++){
      const tooWide = lines.some(l=>l.scrollWidth > MAXW);
      const tooTall = el.scrollHeight > MAXH;
      if(!tooWide && !tooTall) break;
      lines.forEach(l=>{ l.style.fontSize=(parseFloat(getComputedStyle(l).fontSize)*0.97)+'px'; });
    }
    el.style.opacity='0';
  });
}
window.fitAll = fit;

const ease=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
const cl=v=>Math.min(1,Math.max(0,v));
const B1=document.getElementById('b1'),B2=document.getElementById('b2'),B3=document.getElementById('b3'),
      GR=document.getElementById('grain'),FL=document.getElementById('flash'),MK=document.getElementById('mark');

window.render = function(t){
  B1.style.transform=`translate(${-180+320*Math.sin(t*0.20)}px,${140+300*Math.cos(t*0.15)}px)`;
  B2.style.transform=`translate(${600+260*Math.cos(t*0.17)}px,${1120+320*Math.sin(t*0.12+1)}px)`;
  B3.style.transform=`translate(${120+400*Math.sin(t*0.11+2)}px,${700+340*Math.cos(t*0.19+0.5)}px)`;
  const f=Math.floor(t*30);
  GR.style.transform=`translate(${(f*67)%220-110}px,${(f*113)%220-110}px)`;
  const dp=S[2];
  FL.style.opacity = (t>=dp.a && t<dp.a+0.32) ? String(0.6*(1-(t-dp.a)/0.32)) : '0';
  MK.style.opacity = t>6.2 ? String(0.5*ease((t-6.2)/1.2)) : '0';

  els.forEach((el,i)=>{
    const s=S[i], IN=0.22, OUT=0.16;
    if(t<s.a-0.05||t>s.b){ el.style.opacity='0'; return; }
    let o=1, sc=1, y=0;
    if(t<s.a+IN){ const p=ease((t-s.a)/IN); o=p; sc=0.90+0.10*p; y=48*(1-p); }
    else if(t>s.b-OUT){ const p=ease((t-(s.b-OUT))/OUT); o=1-p; sc=1+0.07*p; y=-28*p; }
    if(s.type==='hook'){
      const h1=el.querySelector('#hk1'), h2=el.querySelector('#hk2');
      const p1=cl(ease(t/0.28)), p2=cl(ease((t-1.5)/0.28));
      h1.style.opacity=String(p1); h1.style.transform=`translateY(${32*(1-p1)}px)`;
      h2.style.opacity=String(p2); h2.style.transform=`translateY(${46*(1-p2)}px) scale(${0.93+0.07*p2})`;
      sc=1; y=0; o=(t>s.b-OUT)?o:1;
    }
    if(s.type==='drop'){
      const k=t-s.a;
      if(k<0.5) sc=0.60+0.46*ease(k/0.5);
      const sh=k<0.55?(1-k/0.55)*14:0;
      y += sh*Math.sin(k*58);
      const g=`0 0 ${46+26*Math.sin(t*7)}px rgba(255,46,136,.95),0 0 140px rgba(255,46,136,.5)`;
      el.querySelectorAll('.pink').forEach(n=>n.style.textShadow=g);
    }
    el.style.opacity=String(o);
    el.style.transform=`translateY(calc(-50% + ${y}px)) scale(${sc})`;
  });
};
window.DUR = DUR;
</script></body></html>
