<!doctype html><html><head><meta charset="utf-8">
<script src="fonts.js"></script>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:#0a0a0a;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(130px);will-change:transform}
#b1{width:940px;height:940px;background:#ff2e88;opacity:.34}
#b2{width:860px;height:860px;background:#78e2da;opacity:.26}
#b3{width:760px;height:760px;background:#b0179c;opacity:.34}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 78% 66% at 50% 46%,rgba(0,0,0,0) 0%,rgba(0,0,0,.46) 58%,rgba(0,0,0,.92) 100%)}
#grain{position:absolute;inset:-200px;opacity:.14;mix-blend-mode:overlay;background-repeat:repeat}
#scan{position:absolute;inset:0;opacity:.045;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.9) 0 1px,transparent 1px 4px)}
#flash{position:absolute;inset:0;background:#eaff3d;opacity:0;mix-blend-mode:screen}
.card{position:absolute;left:60px;right:60px;top:47%;text-align:center;opacity:0;padding:70px 40px;
  will-change:transform,opacity;
  background:radial-gradient(ellipse 74% 62% at 50% 50%,rgba(4,4,6,.80) 0%,rgba(4,4,6,.66) 52%,rgba(4,4,6,0) 80%)}
.ln{font-family:Anton,sans-serif;text-transform:uppercase;color:#fff;line-height:1.0;white-space:nowrap;
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8)}
.pink{color:#eaff3d;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8)}
.cy{color:#78e2da;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8)}
.yl{color:#eaff3d;text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8)}
.hk{font-family:Inter,sans-serif;font-weight:900;letter-spacing:-.025em;line-height:1.04;white-space:nowrap;
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.8)}
#mark{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-family:Inter,sans-serif;
  font-weight:900;font-size:30px;letter-spacing:.30em;color:#78e2da;opacity:0;text-transform:uppercase}
</style></head><body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <div id="scan"></div><div id="vig"></div><div id="grain"></div><div id="flash"></div>
  <div id="cards"></div>
  <div id="mark">She Rebels 🤘</div>
</div>
<script>
for (const [n,b64] of Object.entries(window.FONTS)) {
  const fam = n==='anton'?'Anton':n==='inter'?'Inter':'ArchivoBlack';
  const f = new FontFace(fam, `url(data:font/woff2;base64,${b64}) format('woff2')`,{weight:n==='inter'?'900':'400'});
  document.fonts.add(f); f.load();
}
(function(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d'), d=x.createImageData(256,256);
  let s=7;const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  for(let i=0;i<d.data.length;i+=4){const v=200*rnd()+28;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  x.putImageData(d,0,0);
  document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`;
})();

const S = [
 {a:0.0 ,b:3.0 ,type:'hook'},
 {a:3.0 ,b:5.0 ,fs:170,L:['<span class="yl">F#ck</span>','hot girl summer.']},
 {a:5.0 ,b:8.4 ,type:'drop'},
 {a:8.4 ,b:11.0,fs:130,L:['I’m over 40','+ ADHD','+ <span class="cy">perimenopause.</span>']},
 {a:11.0,b:13.8,fs:120,L:['Nobody warned us','these two would team up','like a <span class="yl">villain origin story.</span>']},
 {a:13.8,b:15.8,fs:150,L:['One takes','your focus.']},
 {a:15.8,b:18.4,fs:140,L:['The other takes','whatever <span class="yl">f#cks</span>','<span class="yl">you had left.</span>']},
 {a:18.4,b:20.6,fs:135,L:['I remember being','a fully','functional adult.']},
 {a:20.6,b:23.0,fs:150,L:['Just kidding.','<span class="yl">I can’t remember ship.</span>']},
 {a:23.0,b:25.2,fs:185,L:['I cried at','<span class="cy">Costco.</span>']},
 {a:25.2,b:27.8,fs:140,L:['My hormones','and dopamine','went on vacation.']},
 {a:27.8,b:30.0,fs:170,L:['Without me.','<span class="yl">Ash-holes.</span>']},
 {a:30.0,b:32.2,fs:150,L:['<span class="cy">Unfiltered</span>','is the new','default mode.']},
 {a:32.2,b:34.8,fs:140,L:['Uniform: sweatpants','and an attitude.']},
 {a:34.8,b:36.8,fs:150,L:['<span class="yl">Any attitude.</span>','<span class="yl">Anytime.</span>']},
 {a:36.8,b:38.8,fs:160,L:['Say no','like it’s <span class="cy">cardio.</span>']},
 {a:38.8,b:41.4,fs:130,L:['Saying the quiet parts','out loud is our','<span class="yl">social currency.</span>']},
 {a:41.4,b:43.6,fs:150,L:['Let AI do','the boring crap.']},
 {a:43.6,b:46.4,fs:130,L:['So your <span class="yl">3 good brain hours</span>','go to','what matters.']},
 {a:46.4,b:48.4,fs:185,L:['You’re not','broken.']},
 {a:48.4,b:51.0,fs:150,L:['You’re running','an outdated system','never built for']},
 {a:51.0,b:54.4,fs:135,L:['Neurodivergent,','<span class="yl">perimenopausal goblins</span>','on wrecking balls.']},
 {a:54.4,b:56.8,fs:140,L:['Drop your','<span class="cy">feral girl autumn rule</span>','below.']},
 {a:56.8,b:59.8,fs:145,L:['Follow me into','<span class="yl">feral girl autumn.</span>','<span style="font-size:1.15em">🤘</span>']},
];
const DUR = 59.8, MAXW = 900, MAXH = 1120;

const wrap=document.getElementById('cards');
const els = S.map(s=>{
  const d=document.createElement('div'); d.className='card';
  if(s.type==='hook'){
    d.innerHTML='<div class="hk" id="hk1" style="font-size:104px;color:#ffffff">Doctor: it’s perimenopause</div>'+
                '<div class="hk yl" id="hk2" style="font-size:118px;margin-top:44px">ADHD: good luck, b!tch</div>';
  } else if(s.type==='drop'){
    d.innerHTML='<div class="ln cy" style="font-size:82px;letter-spacing:.18em;margin-bottom:30px">It’s</div>'+
                '<div class="ln yl" style="font-size:186px;line-height:.94">Feral</div>'+
                '<div class="ln yl" style="font-size:186px;line-height:.94">Girl</div>'+
                '<div class="ln yl" style="font-size:186px;line-height:.94">Autumn</div>';
  } else {
    d.innerHTML = s.L.map(l=>`<div class="ln" style="font-size:${s.fs}px">${l}</div>`).join('');
  }
  wrap.appendChild(d); return d;
});

// ---- autofit: shrink until every line fits the safe width and the block fits the height
function fit(){
  els.forEach(el=>{
    el.style.opacity='1'; el.style.transform='translateY(-50%)';
    const lines=[...el.children];
    for(let pass=0;pass<80;pass++){
      const tooWide = lines.some(l=>l.scrollWidth > MAXW);
      const tooTall = el.scrollHeight > MAXH;
      if(!tooWide && !tooTall) break;
      lines.forEach(l=>{ l.style.fontSize=(parseFloat(getComputedStyle(l).fontSize)*0.97)+'px'; });
    }
    el.style.opacity='0';
  });
}
window.fitAll = fit;

const ease=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
const cl=v=>Math.min(1,Math.max(0,v));
const B1=document.getElementById('b1'),B2=document.getElementById('b2'),B3=document.getElementById('b3'),
      GR=document.getElementById('grain'),FL=document.getElementById('flash'),MK=document.getElementById('mark');

window.render = function(t){
  B1.style.transform=`translate(${-180+320*Math.sin(t*0.20)}px,${140+300*Math.cos(t*0.15)}px)`;
  B2.style.transform=`translate(${600+260*Math.cos(t*0.17)}px,${1120+320*Math.sin(t*0.12+1)}px)`;
  B3.style.transform=`translate(${120+400*Math.sin(t*0.11+2)}px,${700+340*Math.cos(t*0.19+0.5)}px)`;
  const f=Math.floor(t*30);
  GR.style.transform=`translate(${(f*67)%220-110}px,${(f*113)%220-110}px)`;
  const dp=S[2];
  FL.style.opacity = (t>=dp.a && t<dp.a+0.32) ? String(0.34*(1-(t-dp.a)/0.32)) : '0';
  MK.style.opacity = t>6.2 ? String(0.5*ease((t-6.2)/1.2)) : '0';

  els.forEach((el,i)=>{
    const s=S[i], IN=0.22, OUT=0.16;
    if(t<s.a-0.05||t>s.b){ el.style.opacity='0'; return; }
    let o=1, sc=1, y=0;
    if(t<s.a+IN){ const p=ease((t-s.a)/IN); o=p; sc=0.90+0.10*p; y=48*(1-p); }
    else if(t>s.b-OUT){ const p=ease((t-(s.b-OUT))/OUT); o=1-p; sc=1+0.07*p; y=-28*p; }
    if(s.type==='hook'){
      const h1=el.querySelector('#hk1'), h2=el.querySelector('#hk2');
      const p1=cl(ease(t/0.28)), p2=cl(ease((t-1.5)/0.28));
      h1.style.opacity=String(p1); h1.style.transform=`translateY(${32*(1-p1)}px)`;
      h2.style.opacity=String(p2); h2.style.transform=`translateY(${46*(1-p2)}px) scale(${0.93+0.07*p2})`;
      sc=1; y=0; o=(t>s.b-OUT)?o:1;
    }
    if(s.type==='drop'){
      const k=t-s.a;
      if(k<0.5) sc=0.60+0.46*ease(k/0.5);
      const sh=k<0.55?(1-k/0.55)*14:0;
      y += sh*Math.sin(k*58);
      el.style.background=`radial-gradient(ellipse 78% 66% at 50% 50%,rgba(2,2,4,${0.90-0.05*Math.sin(t*7)}) 0%,rgba(2,2,4,.74) 52%,rgba(2,2,4,0) 80%)`;
    }
    el.style.opacity=String(o);
    el.style.transform=`translateY(calc(-50% + ${y}px)) scale(${sc})`;
  });
};
window.DUR = DUR;
</script></body></html>
